<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="查看房间、罐体、流量计、仪器及控制系统的设备二维码。" />
    <title>设备二维码</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='white'/%3E%3Cpath d='M4 4h10v10H4zM18 4h10v10H18zM4 18h10v10H4zM18 18h4v4h-4zM24 24h4v4h-4z' fill='%23000'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preload" as="image" href="./assets/qrcodes/slide-1.png" />
    <script defer src="./data/catalog.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="page" aria-label="设备二维码查询">
      <div class="workspace">
        <figure class="qr-card" aria-label="当前设备二维码">
          <div class="qr-picture">
            <img id="qr-image" src="./assets/qrcodes/slide-1.png" width="470" height="470" alt="离心间 D1217 的二维码" draggable="false" />
          </div>
          <figcaption class="qr-caption" aria-live="polite" aria-atomic="true">
            <span id="equipment-name" class="equipment-name">离心间</span>
            <span id="equipment-code" class="equipment-code">D1217</span>
          </figcaption>
        </figure>

        <fieldset id="equipment-options" class="equipment-options">
          <legend class="visually-hidden">选择房间</legend>
        </fieldset>

        <fieldset id="category-options" class="category-options">
          <legend class="visually-hidden">选择设备分类</legend>
        </fieldset>

        <noscript><p class="notice">请启用 JavaScript，以切换房间和设备二维码。</p></noscript>
      </div>
    </main>
  </body>
</html>
