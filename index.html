<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="二维码选择器：按分类快速选中编码，即点即扫。" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5F1" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121613" />
<title>二维码选择器 27</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="app">

  <!-- ===== 顶部标题 ===== -->
  <header class="top">
    <h1 class="brand"><span class="brand-accent">Qr</span>code <span class="brand-accent">Sel</span>ector <strong>27</strong></h1>
  </header>

  <!-- ===== 上方：左二维码卡片 / 右一级分类列 ===== -->
  <section class="stage">
    <article class="qr-card" aria-label="二维码">
      <div class="qr-frame">
        <canvas id="qrCanvas" aria-label="所选编码对应的二维码"></canvas>
        <p class="qr-code" id="codeLabel">—</p>
        <h2 class="qr-title" id="qrTitle">—</h2>
      </div>
    </article>

    <nav class="cat-panel" aria-label="分类选择">
      <div class="cat-list" id="catList" role="radiogroup" aria-label="分类" aria-orientation="vertical"></div>
    </nav>
  </section>

  <!-- ===== 下方：二级编码行（通栏） ===== -->
  <section class="item-panel" aria-label="编码选择">
    <div class="item-grid" id="itemGrid" role="radiogroup" aria-label="编码"></div>
  </section>

</main>

<script src="js/vendor/qrcode-generator.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
